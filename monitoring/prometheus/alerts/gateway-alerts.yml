groups:
  - name: gateway
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m])) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: High 5xx error rate on gateway
          description: Error rate is {{ $value | humanizePercentage }}

      - alert: HighGatewayLatency
        expr: histogram_quantile(0.99, rate(http_server_requests_seconds_bucket{application="mangala-gateway"}[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High p99 latency on gateway
          description: p99 latency is {{ $value | humanizeDuration }}
